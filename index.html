<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QuotePilot"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>QuotePilot</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172235;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:650}input,textarea,select{width:100%;padding:11px;border:1px solid #d5ddea;border-radius:9px;background:white;color:#18243a}label{display:block;font-size:12px;font-weight:700;color:#63718a;margin-bottom:6px}.app{max-width:1150px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand b{color:#3478f6}.pill{font-size:12px;color:#68788d}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav button{background:#e8eef8;color:#53657e}.nav button.active{background:#172b4d;color:white}.primary{background:#3478f6;color:white}.secondary{background:#e8eef8;color:#263e63}.danger{background:#fff0f0;color:#c23e3e}.card{background:white;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 22px #1b34530a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{font-size:30px;font-weight:800;margin:7px 0}.muted{color:#718099;font-size:13px}.line{border-top:1px solid #edf0f5;padding:14px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.line:first-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{margin:0}.item{display:grid;grid-template-columns:3fr 1fr 1fr auto;gap:9px;align-items:end;margin:10px 0}.total{font-size:26px;font-weight:850}.empty{text-align:center;padding:35px;color:#77869a}.small{padding:8px 10px;font-size:12px}.status{font-size:12px;background:#e9f1ff;color:#245fb8;border-radius:100px;padding:5px 9px}#printArea{display:none}@media(max-width:650px){.app{padding:15px}.grid,.two{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .description{grid-column:1/-1}.top{align-items:flex-start}.brand{font-size:22px}.card{padding:15px}}@media print{body{background:white}.app{display:none!important}#printArea{display:block!important;padding:35px;font-family:Arial,sans-serif}#printArea table{width:100%;border-collapse:collapse;margin-top:25px}#printArea td,#printArea th{padding:12px;border-bottom:1px solid #ddd;text-align:left}#printArea .right{text-align:right}#printArea img{break-inside:avoid}}@media(max-width:650px){.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;position:sticky;top:0;z-index:5;background:#f3f6fb;padding:7px 0}.nav button{font-size:11px;padding:10px 2px}.app{padding-bottom:max(24px,env(safe-area-inset-bottom))}}#installHint{padding:12px;background:#e7f0ff;border-radius:12px;margin-bottom:12px;font-size:13px}#installHint[hidden]{display:none}</style></head><body><div class="app"><div class="top"><div><div class="brand">Quote<b>Pilot</b> </div><div class="pill">Estimates made simple.</div></div><button class="primary" onclick="newQuote()">+ New estimate</button></div><div class="nav"><button id="tab-dashboard" onclick="show('dashboard')">Dashboard</button><button id="tab-quotes" onclick="show('quotes')">Estimates</button><button id="tab-customers" onclick="show('customers')">Customers</button><button id="tab-settings" onclick="show('settings')">Business settings</button></div><div id="installHint" hidden>Install on iPhone: in Safari tap Share → Add to Home Screen → Add. Back up your data regularly. <button class="secondary small" onclick="this.parentElement.hidden=true">Dismiss</button></div><main id="content"></main></div><div id="printArea"></div><script>
const KEY='quotepilot-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=db||{business:{name:'Your Business',email:'',phone:'',address:'',tax:0,notes:'Thank you for the opportunity to earn your business.'},customers:[],quotes:[]};let page='dashboard',editId=null,items=[],quoteLogo='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);function show(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+p));render()};function safeLogo(src){return typeof src==='string' && /^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(src) ? src : ''}
function logoPreview(src){return safeLogo(src)?`<img src="${safeLogo(src)}" alt="Business logo" style="max-width:170px;max-height:100px;object-fit:contain;border:1px solid #e5eaf2;border-radius:10px;padding:8px;background:#fff">`:'<span class="muted">No logo selected</span>'}
function loadLogo(event,context){const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Choose a PNG, JPG or WebP image.');return}if(file.size>8*1024*1024){alert('Image is too large. Choose a file smaller than 8 MB.');return}const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const canvas=document.createElement('canvas');const scale=Math.min(1,500/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/png');if(data.length>600000){alert('Logo is too large after resizing. Try a simpler or smaller image.');return}if(context==='business'){db.business.logo=data;try{save()}catch(e){alert('Storage is full. Try a smaller logo or export a backup.');return}$('#businessLogoPreview').innerHTML=logoPreview(data)}else{quoteLogo=data;$('#quoteLogoPreview').innerHTML=logoPreview(data)}}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);alert('Could not read that image.')};img.src=url}
function removeLogo(context){if(context==='business'){db.business.logo='';save();$('#businessLogoPreview').innerHTML=logoPreview('')}else{quoteLogo='';$('#quoteLogoPreview').innerHTML=logoPreview('')}}
function quoteTotal(q){let sub=q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);sub+=(+q.laborHours||0)*(+q.laborRate||0);return sub*(1+(+q.tax||0)/100)}function render(){const c=$('#content');if(page==='dashboard'){const total=db.quotes.reduce((s,q)=>s+quoteTotal(q),0),accepted=db.quotes.filter(q=>q.status==='Accepted').reduce((s,q)=>s+quoteTotal(q),0);c.innerHTML=`<div class="head"><h1>Overview</h1><span class="muted">Your business at a glance</span></div><div class="grid"><div class="card"><div class="muted">Total estimates</div><div class="stat">${db.quotes.length}</div></div><div class="card"><div class="muted">Estimated pipeline</div><div class="stat">${money(total)}</div></div><div class="card"><div class="muted">Accepted value</div><div class="stat">${money(accepted)}</div></div></div><div class="card"><div class="head"><h2>Recent estimates</h2><button class="secondary small" onclick="show('quotes')">View all</button></div>${quoteList(db.quotes.slice().reverse().slice(0,5))}</div>`}else if(page==='quotes'){c.innerHTML=`<div class="head"><h1>Estimates</h1><button class="primary" onclick="newQuote()">+ Create estimate</button></div><div class="card">${quoteList(db.quotes.slice().reverse())}</div>`}else if(page==='customers'){c.innerHTML=`<div class="head"><h1>Customers</h1><button class="primary" onclick="customerForm()">+ Add customer</button></div><div class="card">${db.customers.length?db.customers.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.email)} ${esc(x.phone)}</div></div><button class="secondary small" onclick="customerForm('${x.id}')">Edit</button></div>`).join(''):'<div class="empty">No customers yet. Add your first customer.</div>'}</div>`}else if(page==='settings'){const b=db.business;c.innerHTML=`<h1>Business settings</h1><div class="card"><div class="two">${field('Business name','bname',b.name)}${field('Email','bemail',b.email)}${field('Phone','bphone',b.phone)}${field('Address','baddress',b.address)}${field('Default tax rate (%)','btax',b.tax,'number')}${field('Default labor rate ($/hour)','blaborrate',b.laborRate??0,'number')}</div><div class="card" style="margin-top:15px"><h2>Business logo</h2><p class="muted">Your default logo appears on new quotes and PDFs. PNG, JPG or WebP.</p><div id="businessLogoPreview">${logoPreview(b.logo)}</div><input style="margin-top:10px" type="file" accept="image/png,image/jpeg,image/webp" onchange="loadLogo(event,'business')"><button class="secondary small" style="margin-top:8px" onclick="removeLogo('business')">Remove logo</button></div><div style="margin-top:14px">${field('Default estimate notes','bnotes',b.notes)}</div><div style="margin-top:15px"><button class="primary" onclick="saveSettings()">Save settings</button></div></div><p class="muted">Data is stored locally in this browser. Export a backup regularly; clearing browser data may erase your estimates.</p><div class="actions"><button class="secondary" onclick="backup()">Export backup</button><button class="secondary" onclick="$('#restore').click()">Import backup</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restore(event)"></div>`}}function field(label,id,value='',type='text'){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function quoteList(arr){return arr.length?arr.map(q=>`<div class="line"><div><b>${esc(q.number)} · ${esc(q.customerName)}</b><div class="muted">${esc(q.title)} · ${esc(q.date)}</div><span class="status">${esc(q.status)}</span></div><div style="text-align:right"><b>${money(quoteTotal(q))}</b><div style="margin-top:8px"><button class="secondary small" onclick="editQuote('${q.id}')">Open</button></div></div></div>`).join(''):'<div class="empty">No estimates yet. Create your first one!</div>'}function customerForm(id){let x=db.customers.find(c=>c.id===id)||{};$('#content').innerHTML=`<div class="head"><h1>${id?'Edit':'Add'} customer</h1><button class="secondary" onclick="show('customers')">Back</button></div><div class="card"><div class="two">${field('Customer name','cname',x.name)}${field('Email','cemail',x.email)}${field('Phone','cphone',x.phone)}${field('Address','caddress',x.address)}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveCustomer('${id||''}')">Save customer</button>${id?`<button class="danger" onclick="deleteCustomer('${id}')">Delete</button>`:''}</div></div>`}function saveCustomer(id){let name=$('#cname').value.trim();if(!name)return alert('Customer name is required.');let x={id:id||uid(),name,email:$('#cemail').value,phone:$('#cphone').value,address:$('#caddress').value};if(id)db.customers=db.customers.map(c=>c.id===id?x:c);else db.customers.push(x);save();show('customers')}function deleteCustomer(id){if(confirm('Delete this customer? Existing estimates will remain.')){db.customers=db.customers.filter(x=>x.id!==id);save();show('customers')}}function saveSettings(){db.business={name:$('#bname').value,email:$('#bemail').value,phone:$('#bphone').value,address:$('#baddress').value,tax:+$('#btax').value||0,laborRate:Math.max(0,+$('#blaborrate').value||0),notes:$('#bnotes').value,logo:db.business.logo||''};save();alert('Business settings saved.')}function newQuote(){editId=null;quoteLogo=db.business.logo||'';items=[{description:'',qty:1,price:0}];quoteForm()}function editQuote(id){editId=id;quoteLogo=db.quotes.find(q=>q.id===id).logo??db.business.logo??'';items=JSON.parse(JSON.stringify(db.quotes.find(q=>q.id===id).items));quoteForm()}function quoteForm(){let q=db.quotes.find(q=>q.id===editId)||{number:'QP-'+String(db.quotes.length+1).padStart(4,'0'),title:'',date:new Date().toISOString().slice(0,10),expires:'',logo:db.business.logo||'',customerId:'',tax:db.business.tax,laborHours:0,laborRate:db.business.laborRate??0,notes:db.business.notes,status:'Draft'};page='editor';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('#content').innerHTML=`<div class="head"><h1>${editId?'Edit':'New'} estimate</h1><button class="secondary" onclick="show('quotes')">Back</button></div><div class="card"><div class="two">${field('Estimate number','qnumber',q.number)}${field('Date','qdate',q.date,'date')}${field('Quote expiration date','qexpires',q.expires||'','date')}${field('Job title','qtitle',q.title)}<div><label>Customer</label><select id="qcustomer"><option value="">Select customer</option>${db.customers.map(x=>`<option value="${x.id}" ${x.id===q.customerId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="secondary small" style="margin-top:7px" onclick="customerFormFromQuote()">+ Add customer</button></div><div><label>Status</label><select id="qstatus">${['Draft','Sent','Accepted','Declined'].map(s=>`<option ${s===q.status?'selected':''}>${s}</option>`).join('')}</select></div>${field('Tax rate (%)','qtax',q.tax,'number')}</div></div><div class="card"><div class="head"><h2>Business logo for this quote</h2></div><p class="muted">Starts with the logo in Business Settings. You can replace or remove it for this estimate only.</p><div id="quoteLogoPreview">${logoPreview(quoteLogo)}</div><input style="margin-top:10px" type="file" accept="image/png,image/jpeg,image/webp" onchange="loadLogo(event,'quote')"><button class="secondary small" style="margin-top:8px" onclick="removeLogo('quote')">Remove from this quote</button></div><div class="card"><div class="head"><h2>Labor</h2><span class="muted">Hourly labor pricing</span></div><div class="two">${field('Labor rate ($/hour)','qlaborrate',q.laborRate??0,'number')}${field('Labor hours','qlaborhours',q.laborHours??0,'number')}</div><div class="line"><span>Labor total</span><b id="labortotal">${money((+q.laborRate||0)*(+q.laborHours||0))}</b></div></div><div class="card"><div class="head"><h2>Line items</h2><button class="secondary small" onclick="addItem()">+ Add item</button></div><div id="itemRows"></div><div class="line"><span>Subtotal</span><b id="subtotal"></b></div><div class="line"><span>Tax</span><b id="taxvalue"></b></div><div class="line"><b>Total</b><span class="total" id="grandtotal"></span></div></div><div class="card"><label>Notes / terms</label><textarea id="qnotes" rows="3">${esc(q.notes)}</textarea></div><div class="actions"><button class="primary" onclick="saveQuote()">Save estimate</button><button class="secondary" onclick="printCurrent()">Print / Save PDF</button><button class="secondary" onclick="shareCurrent()">Share estimate</button>${editId?`<button class="danger" onclick="deleteQuote()">Delete</button>`:''}</div>`;renderItems()}function customerFormFromQuote(){alert('Save this estimate first, then add a customer under Customers.');}function addItem(){collectItems();items.push({description:'',qty:1,price:0});renderItems()}function collectItems(){items=items.map((x,i)=>({description:$('#desc'+i)?.value??x.description,qty:+($('#qty'+i)?.value??x.qty),price:+($('#price'+i)?.value??x.price)}))}function renderItems(){let r=$('#itemRows');r.innerHTML=items.map((i,n)=>`<div class="item"><div class="description">${field('Description','desc'+n,i.description)}</div>${field('Qty','qty'+n,i.qty,'number')}${field('Unit price ($)','price'+n,i.price,'number')}<button class="danger small" onclick="removeItem(${n})" title="Remove">×</button></div>`).join('');r.querySelectorAll('input').forEach(x=>x.addEventListener('input',totals));['qlaborrate','qlaborhours','qtax'].forEach(id=>$('#'+id).addEventListener('input',totals));totals()}function removeItem(n){collectItems();items.splice(n,1);if(!items.length)items.push({description:'',qty:1,price:0});renderItems()}function totals(){collectItems();let labor=(+$('#qlaborrate').value||0)*(+$('#qlaborhours').value||0);$('#labortotal').textContent=money(labor);let sub=items.reduce((s,i)=>s+i.qty*i.price,0)+labor,tax=sub*(+($('#qtax').value)||0)/100;$('#subtotal').textContent=money(sub);$('#taxvalue').textContent=money(tax);$('#grandtotal').textContent=money(sub+tax)}function getQuote(){collectItems();let customer=db.customers.find(x=>x.id===$('#qcustomer').value);if(!customer){alert('Please select a customer. Add one in the Customers tab first.');return null}if($('#qexpires').value && $('#qdate').value && $('#qexpires').value<$('#qdate').value){alert('Expiration date cannot be before the estimate date.');return null}return {id:editId||uid(),number:$('#qnumber').value.trim()||'Estimate',date:$('#qdate').value,expires:$('#qexpires').value,logo:quoteLogo,title:$('#qtitle').value,customerId:customer.id,customerName:customer.name,customerEmail:customer.email,customerAddress:customer.address,customerPhone:customer.phone,status:$('#qstatus').value,tax:+$('#qtax').value||0,laborRate:+$('#qlaborrate').value||0,laborHours:+$('#qlaborhours').value||0,notes:$('#qnotes').value,items:JSON.parse(JSON.stringify(items))}}function saveQuote(){let q=getQuote();if(!q)return;let i=db.quotes.findIndex(x=>x.id===q.id);if(i>=0)db.quotes[i]=q;else db.quotes.push(q);save();show('quotes')}function deleteQuote(){if(confirm('Delete this estimate?')){db.quotes=db.quotes.filter(q=>q.id!==editId);save();show('quotes')}}function printCurrent(){let q=getQuote();if(!q)return;let b=db.business,sub=q.items.reduce((s,i)=>s+i.qty*i.price,0)+(+q.laborRate||0)*(+q.laborHours||0);$('#printArea').innerHTML=`<div style="display:flex;justify-content:space-between;gap:20px"><div>${safeLogo(q.logo)?`<img src="${safeLogo(q.logo)}" alt="Business logo" style="max-width:170px;max-height:95px;object-fit:contain;display:block;margin-bottom:12px">`:''}<h1>${esc(b.name)}</h1><p>${esc(b.address)}<br>${esc(b.phone)}<br>${esc(b.email)}</p></div><div style="text-align:right"><h1>ESTIMATE</h1><b>${esc(q.number)}</b><p>Issued: ${esc(q.date)}</p>${q.expires?`<p><b>Valid until: ${esc(q.expires)}</b></p>`:''}</div></div><hr><h3>Prepared for</h3><p>${esc(q.customerName)}<br>${esc(q.customerAddress)}<br>${esc(q.customerEmail)}</p><h2>${esc(q.title)}</h2><table><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th class="right">Amount</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div style="margin-top:22px"><h3>Labor</h3><p>${+q.laborHours||0} hours × ${money(q.laborRate)}/hour = <b>${money((+q.laborHours||0)*(+q.laborRate||0))}</b></p></div><div style="text-align:right;margin-top:25px"><p>Subtotal: ${money(sub)}</p><p>Tax (${q.tax}%): ${money(sub*q.tax/100)}</p><h2>Total: ${money(quoteTotal(q))}</h2></div><p style="margin-top:40px;white-space:pre-wrap">${esc(q.notes)}</p>`;window.print()}async function shareCurrent(){
  const q=getQuote();if(!q)return;
  const customer=db.customers.find(c=>c.id===q.customerId);
  const text=`${db.business.name||'QuotePilot'} estimate ${q.number}\nCustomer: ${customer?.name||''}\nTotal: ${money(quoteTotal(q))}${q.expires?'\nValid until: '+q.expires:''}\n\n${q.notes||''}`;
  try{
    if(window.Capacitor?.isNativePlatform?.() && window.Capacitor?.Plugins?.Share){
      await window.Capacitor.Plugins.Share.share({title:'QuotePilot estimate '+q.number,text,dialogTitle:'Share estimate'});
    }else if(navigator.share){await navigator.share({title:'QuotePilot estimate '+q.number,text})}
    else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);alert('Estimate summary copied to clipboard.')}
    else alert(text);
  }catch(e){if(e?.message && !/cancel|abort/i.test(e.message))alert('Could not share the estimate. Please try again.')}
}
function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='quotepilot-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.business||!Array.isArray(d.quotes)||!Array.isArray(d.customers))throw Error();if(confirm('Replace all current data with this backup?')){db=d;save();show('dashboard')}}catch(e){alert('Invalid QuotePilot backup file.')}};reader.readAsText(f)}show('dashboard');</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
if (!window.Capacitor?.isNativePlatform?.() && /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches) document.getElementById('installHint').hidden=false;
</script></body></html>
